<!DOCTYPE html>
<!-- Carte des fuseaux UTM, reprise de BVTrace (BVTrace.App/Assets/utm_zones_map.html) : clic d'un fuseau → message
     { type: 'utmCrs', epsg } à la page hôte ; la page hôte envoie { type: 'setUtmContext', epsg, suggestEpsg, lon, lat, line }. -->
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fuseaux UTM — INFRA-KSR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; height:100%; background:#121820; color:#E8EEF4; font:12px "Segoe UI",sans-serif; }
  #map { position:absolute; inset:0; }
  #bar {
    position:absolute; left:10px; bottom:22px; z-index:1000;
    background:rgba(26,35,50,.92); border:1px solid #3D4F66; border-radius:6px;
    padding:6px 8px; max-width:300px; box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #bar h1 { margin:0 0 4px; font-size:13px; font-weight:600; }
  #bar .hint { margin:0 0 8px; color:#9AABBC; font-size:11px; line-height:1.35; }
  #bar .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #bar button {
    background:#2C7FB8; color:#fff; border:0; border-radius:4px;
    padding:5px 10px; font:600 11px "Segoe UI"; cursor:pointer;
  }
  #bar button.sec { background:#354860; }
  #bar button:disabled { opacity:.45; cursor:default; }
  #sel {
    font:600 12px "Segoe UI"; color:#7EC8E3; margin-top:6px;
  }
  .zone-label {
    background:rgba(18,24,32,.78); border:1px solid rgba(255,255,255,.25);
    border-radius:3px; color:#F0F4F8; font:700 11px/1.1 "Segoe UI",sans-serif;
    padding:2px 5px; white-space:nowrap; pointer-events:none;
  }
  .zone-label::before { display:none; }
  .leaflet-container { background:#0D121A; }
  @media (max-width: 520px) { #bar .hint { display:none; } #bar { max-width:220px; } }
</style>
</head>
<body>
<div id="bar">
  <h1>Fuseaux UTM (WGS 84)</h1>
  <p class="hint">Cliquez un fuseau coloré pour en faire le système du projet (UTM WGS 84). Tunisie ≈ <b>32N</b> · Sénégal ≈ <b>28N</b> · Côte d’Ivoire ≈ <b>29N / 30N</b> · Togo ≈ <b>31N</b>.</p>
  <div class="row">
    <button id="btnSuggest" disabled title="Appliquer le fuseau où se trouve le projet">Fuseau du projet</button>
    <button id="btnWorld" class="sec">Monde</button>
    <button id="btnAfrica" class="sec">Afrique</button>
  </div>
  <div id="sel">Aucun fuseau sélectionné</div>
</div>
<div id="map"></div>
<script>
const map = L.map('map', { worldCopyJump: true, zoomControl: true })
  .setView([15, 5], 3);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri', maxZoom: 18
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  opacity: 0.85, maxZoom: 18
}).addTo(map);

const PALETTE = [
  '#E6194B','#3CB44B','#FFE119','#4363D8','#F58231','#911EB4',
  '#42D4F4','#F032E6','#BFEF45','#FABED4','#469990','#DCBEFF'
];
function zoneColor(z, hemi) {
  let c = PALETTE[(z - 1) % PALETTE.length];
  if (hemi === 'S') {
    // assombrir un peu
    const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    const f = v => Math.round(v * 0.75).toString(16).padStart(2,'0');
    c = '#' + f(r) + f(g) + f(b);
  }
  return c;
}

function buildZones() {
  const feats = [];
  for (let z = 1; z <= 60; z++) {
    const lonW = (z - 1) * 6 - 180;
    const lonE = lonW + 6;
    for (const hemi of ['N','S']) {
      const latS = hemi === 'N' ? 0 : -80;
      const latN = hemi === 'N' ? 84 : 0;
      const epsg = 'EPSG:' + ((hemi === 'N' ? 32600 : 32700) + z);
      feats.push({
        type: 'Feature',
        properties: {
          zone: z, hemi, epsg,
          name: 'WGS 84 / UTM zone ' + z + hemi,
          fill: zoneColor(z, hemi)
        },
        geometry: {
          type: 'Polygon',
          coordinates: [[[lonW,latS],[lonE,latS],[lonE,latN],[lonW,latN],[lonW,latS]]]
        }
      });
    }
  }
  return { type: 'FeatureCollection', features: feats };
}

let selectedEpsg = null;
let suggest = null; // { epsg, lon, lat }
let routeLayer = null;
let selectedLayer = null;
const labels = L.layerGroup().addTo(map);

function styleFeature(f) {
  const p = f.properties;
  const sel = p.epsg === selectedEpsg;
  return {
    color: sel ? '#FFFFFF' : '#1A2332',
    weight: sel ? 2.5 : 0.6,
    fillColor: p.fill,
    fillOpacity: sel ? 0.55 : 0.28
  };
}

const zones = L.geoJSON(buildZones(), {
  style: styleFeature,
  onEachFeature(f, layer) {
    const p = f.properties;
    layer.bindTooltip(p.zone + p.hemi + ' — ' + p.epsg, { sticky: true });
    layer.on('click', () => selectEpsg(p.epsg, true));
  }
}).addTo(map);

function refreshLabels() {
  labels.clearLayers();
  const z = map.getZoom();
  if (z < 3) return;
  zones.eachLayer(layer => {
    const p = layer.feature.properties;
    const b = layer.getBounds();
    if (!map.getBounds().intersects(b)) return;
    // Étiquettes densifiées seulement à zoom confortable
    if (z < 4 && p.zone % 2 !== 0) return;
    const c = b.getCenter();
    const icon = L.divIcon({
      className: '',
      html: '<div class="zone-label">' + p.zone + p.hemi + '</div>',
      iconSize: [36, 16], iconAnchor: [18, 8]
    });
    labels.addLayer(L.marker(c, { icon, interactive: false }));
  });
}
map.on('moveend zoomend', refreshLabels);
refreshLabels();

function setSelText(epsg) {
  const el = document.getElementById('sel');
  if (!epsg) { el.textContent = 'Aucun fuseau sélectionné'; return; }
  const m = /EPSG:(326|327)(\d{2})/.exec(epsg);
  if (!m) { el.textContent = epsg; return; }
  const hemi = m[1] === '326' ? 'N' : 'S';
  const zone = parseInt(m[2], 10);
  el.innerHTML = 'Sélection : <b>' + zone + hemi + '</b> — ' + epsg;
}

function hostPost(msg) {
  if (window.chrome && chrome.webview) chrome.webview.postMessage(msg);
  else if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
}

function applyUtmContext(msg) {
  if (!msg || msg.type !== 'setUtmContext') return;
  if ('epsg' in msg) selectEpsg(msg.epsg || null, false); // null : projet en coordonnées locales
  if (msg.suggestEpsg && Number.isFinite(msg.lon) && Number.isFinite(msg.lat)) {
    suggest = { epsg: msg.suggestEpsg, lon: msg.lon, lat: msg.lat };
    document.getElementById('btnSuggest').disabled = false;
    if (!msg.epsg) selectEpsg(msg.suggestEpsg, false);
    map.setView([msg.lat, msg.lon], 5);
  }
  if (Array.isArray(msg.line) && msg.line.length >= 2) {
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(msg.line.map(p => [p[1], p[0]]), {
      color: '#FF3B30', weight: 3, opacity: 0.95
    }).addTo(map);
    try { map.fitBounds(routeLayer.getBounds().pad(0.35)); } catch {}
  }
}

function selectEpsg(epsg, notifyHost) {
  selectedEpsg = epsg;
  zones.setStyle(styleFeature);
  setSelText(epsg);
  if (notifyHost) hostPost({ type: 'utmCrs', epsg });
}

document.getElementById('btnWorld').onclick = () => map.setView([15, 5], 2);
document.getElementById('btnAfrica').onclick = () => map.setView([8, 5], 4);
document.getElementById('btnSuggest').onclick = () => {
  if (!suggest) return;
  selectEpsg(suggest.epsg, true);
  map.setView([suggest.lat, suggest.lon], 6);
};

function onHostMessage(ev) {
  let msg = ev.data;
  if (typeof msg === 'string') {
    try { msg = JSON.parse(msg); } catch { return; }
  }
  applyUtmContext(msg);
}
window.chrome?.webview?.addEventListener('message', onHostMessage);
window.addEventListener('message', onHostMessage);

hostPost({ type: 'utmReady' });
</script>
</body>
</html>
